
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        location / {
            access_by_lua_block {
                local file = io.open("/usr/local/openresty/nginx/conf/kill_switch.flag", "r")

                if file then
                    local state = file:read("*a")
                    file:close()

                    if state and state:match("DISABLED") then
                        ngx.status = 503
                        ngx.header.content_type = "application/json"
                        ngx.say('{"error":"AI service disabled by kill switch"}')
                        return ngx.exit(503)
                    end
                end
            }

            proxy_pass http://host.docker.internal:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

