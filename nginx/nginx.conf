worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        location / {
            access_by_lua_block {
                local path = ngx.var.uri
                local admin_paths = {
                    ["/api/admin/kill/"] = true,
                    ["/api/admin/status/"] = true,
                    ["/api/admin/reset/"] = true,
                }

                -- Keep the control endpoints reachable so an operator can
                -- inspect or reset the state while regular traffic is blocked.
                if not admin_paths[path] then
                    local redis = require "resty.redis"
                    local red = redis:new()
                    red:set_timeouts(1000, 1000, 1000)

                    local ok, err = red:connect("redis", 6379)
                    if not ok then
                        ngx.log(ngx.ERR, "kill switch Redis connection failed: ", err)
                        ngx.status = ngx.HTTP_SERVICE_UNAVAILABLE
                        ngx.header.content_type = "application/json"
                        ngx.say('{"error":"AI service state unavailable"}')
                        return ngx.exit(ngx.HTTP_SERVICE_UNAVAILABLE)
                    end

                    local state, get_err = red:get("ai_service:state")
                    if get_err then
                        ngx.log(ngx.ERR, "kill switch Redis read failed: ", get_err)
                        red:close()
                        ngx.status = ngx.HTTP_SERVICE_UNAVAILABLE
                        ngx.header.content_type = "application/json"
                        ngx.say('{"error":"AI service state unavailable"}')
                        return ngx.exit(ngx.HTTP_SERVICE_UNAVAILABLE)
                    end

                    if state ~= ngx.null and state ~= "ENABLED" then
                        red:set_keepalive(10000, 100)
                        ngx.status = ngx.HTTP_SERVICE_UNAVAILABLE
                        ngx.header.content_type = "application/json"
                        ngx.say('{"error":"AI service disabled by kill switch"}')
                        return ngx.exit(ngx.HTTP_SERVICE_UNAVAILABLE)
                    end

                    local keepalive_ok, keepalive_err = red:set_keepalive(10000, 100)
                    if not keepalive_ok then
                        ngx.log(ngx.WARN, "Redis keepalive failed: ", keepalive_err)
                    end
                end
            }

            proxy_pass http://host.docker.internal:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
