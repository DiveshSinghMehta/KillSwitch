
services:
  redis:
    image: redis:7-alpine
    container_name: killswitch-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  nginx:
    image: openresty/openresty:alpine
    container_name: killswitch-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
    depends_on:
      - redis

volumes:
  redis_data:

